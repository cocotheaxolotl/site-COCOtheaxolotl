<script>
const PUZZLES = [

const WIN_MSGS = ['¡Las encontraste todas! 🌟','¡Eres una estrella! ⭐','¡Increíble! 🎉','¡Qué inteligente! 🦋','¡Viva! 🌈'];
let currentPuzzleIdx=0,foundWords=new Set(),selecting=false,startCell=null,currentCells=[],cellEls=[];

function loadPuzzle(idx){currentPuzzleIdx=idx;foundWords=new Set();selecting=false;startCell=null;currentCells=[];document.getElementById('win-overlay').classList.remove('show');buildGrid();updatePuzzleButtons();}
function updatePuzzleButtons(){document.querySelectorAll('.puzzle-btn').forEach((btn,i)=>btn.classList.toggle('active',i===currentPuzzleIdx));document.getElementById('next-btn').style.display=currentPuzzleIdx>=PUZZLES.length-1?'none':'';}
function buildPuzzleSelector(){const sel=document.getElementById('puzzle-selector');PUZZLES.forEach((p,i)=>{const btn=document.createElement('button');btn.className='puzzle-btn'+(i===currentPuzzleIdx?' active':'');btn.type='button';btn.textContent=p.title;btn.onclick=()=>loadPuzzle(i);sel.appendChild(btn);});}
function buildGrid(){const puzzle=PUZZLES[currentPuzzleIdx],grid=document.getElementById('grid');grid.innerHTML='';cellEls=[];for(let r=0;r<12;r++){cellEls[r]=[];for(let c=0;c<12;c++){const el=document.createElement('div');el.className='cell';el.textContent=puzzle.grid[r][c];grid.appendChild(el);cellEls[r][c]=el;}}buildWordList();buildSvg();if(!grid._eventsSet){setupEvents();grid._eventsSet=true;}}
function buildWordList(){const wl=document.getElementById('word-list');wl.innerHTML='';PUZZLES[currentPuzzleIdx].words.forEach((w,i)=>{const el=document.createElement('div');el.className='word-item';el.id='word-'+i;el.textContent=w.word;wl.appendChild(el);});}
function buildSvg(){const puzzle=PUZZLES[currentPuzzleIdx],svg=document.getElementById('svg-overlay'),grid=document.getElementById('grid');const w=grid.offsetWidth,h=grid.offsetHeight;svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML='';const cs=w/12,colors=['#ff69b4','#f4a0c8','#e87bbf','#d955a8','#f08fc0','#c94499','#e066b3','#f77dc2','#dc4da6'];puzzle.words.forEach((wd,i)=>{if(!foundWords.has(i))return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');const[r1,c1]=wd.cells[0],[r2,c2]=wd.cells[wd.cells.length-1];line.setAttribute('x1',(c1+.5)*cs);line.setAttribute('y1',(r1+.5)*cs);line.setAttribute('x2',(c2+.5)*cs);line.setAttribute('y2',(r2+.5)*cs);line.setAttribute('stroke',colors[i%colors.length]);line.setAttribute('stroke-width',cs*.72);line.setAttribute('class','found-line');svg.appendChild(line);});}
function getCellFromPoint(x,y){const rect=document.getElementById('grid').getBoundingClientRect(),cs=rect.width/12;const c=Math.floor((x-rect.left)/cs),r=Math.floor((y-rect.top)/cs);return(r>=0&&r<12&&c>=0&&c<12)?[r,c]:null;}
function getCellsInLine(r1,c1,r2,c2){const dr=r2-r1,dc=c2-c1;if(!dr&&!dc)return[[r1,c1]];if(dr&&dc&&Math.abs(dr)!==Math.abs(dc)){if(Math.abs(dr)>Math.abs(dc)){const a=[],s=dr>0?1:-1;for(let r=r1;r!==r2+s;r+=s)a.push([r,c1]);return a;}else{const a=[],s=dc>0?1:-1;for(let c=c1;c!==c2+s;c+=s)a.push([r1,c]);return a;}}const steps=Math.max(Math.abs(dr),Math.abs(dc)),sr=dr?dr>0?1:-1:0,sc=dc?dc>0?1:-1:0,a=[];for(let i=0;i<=steps;i++)a.push([r1+i*sr,c1+i*sc]);return a;}
function clearSelection(){currentCells.forEach(([r,c])=>{if(cellEls[r]&&cellEls[r][c]&&!cellEls[r][c].classList.contains('found'))cellEls[r][c].classList.remove('selecting');});currentCells=[];}
function updateSelection(cells){clearSelection();currentCells=cells;cells.forEach(([r,c])=>{if(!cellEls[r][c].classList.contains('found'))cellEls[r][c].classList.add('selecting');});}
function checkWord(cells){const puzzle=PUZZLES[currentPuzzleIdx],str=cells.map(([r,c])=>puzzle.grid[r][c]).join(''),rev=str.split('').reverse().join('');for(let i=0;i<puzzle.words.length;i++){if(foundWords.has(i))continue;const t=puzzle.words[i].word;if(str!==t&&rev!==t)continue;const sel=cells.map(([r,c])=>r+','+c).join('|'),fwd=puzzle.words[i].cells.map(([r,c])=>r+','+c).join('|'),bwd=[...puzzle.words[i].cells].reverse().map(([r,c])=>r+','+c).join('|');if(sel===fwd||sel===bwd)return i;}return -1;}
function markFound(idx){foundWords.add(idx);PUZZLES[currentPuzzleIdx].words[idx].cells.forEach(([r,c])=>{cellEls[r][c].classList.remove('selecting');cellEls[r][c].classList.add('found','word-'+idx);});document.getElementById('word-'+idx).classList.add('found');buildSvg();if(foundWords.size===PUZZLES[currentPuzzleIdx].words.length){document.getElementById('win-msg').textContent=WIN_MSGS[currentPuzzleIdx%WIN_MSGS.length];setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),400);}}
function setupEvents(){const grid=document.getElementById('grid');grid.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],cell=getCellFromPoint(t.clientX,t.clientY);if(!cell)return;selecting=true;startCell=cell;updateSelection([cell]);},{passive:false});grid.addEventListener('touchmove',e=>{e.preventDefault();if(!selecting)return;const t=e.touches[0],cell=getCellFromPoint(t.clientX,t.clientY);if(!cell)return;updateSelection(getCellsInLine(startCell[0],startCell[1],cell[0],cell[1]));},{passive:false});grid.addEventListener('touchend',e=>{e.preventDefault();if(!selecting)return;selecting=false;const idx=checkWord(currentCells);if(idx>=0)markFound(idx);else clearSelection();currentCells=[];startCell=null;},{passive:false});grid.addEventListener('mousedown',e=>{const cell=getCellFromPoint(e.clientX,e.clientY);if(!cell)return;selecting=true;startCell=cell;updateSelection([cell]);});grid.addEventListener('mousemove',e=>{if(!selecting)return;const cell=getCellFromPoint(e.clientX,e.clientY);if(!cell)return;updateSelection(getCellsInLine(startCell[0],startCell[1],cell[0],cell[1]));});grid.addEventListener('mouseup',()=>{if(!selecting)return;selecting=false;const idx=checkWord(currentCells);if(idx>=0)markFound(idx);else clearSelection();currentCells=[];startCell=null;});document.addEventListener('mouseup',()=>{if(selecting){selecting=false;clearSelection();currentCells=[];startCell=null;}});}
function resetGame(){loadPuzzle(currentPuzzleIdx);}
function nextPuzzle(){if(currentPuzzleIdx<PUZZLES.length-1)loadPuzzle(currentPuzzleIdx+1);}
buildPuzzleSelector();loadPuzzle(0);
window.addEventListener('resize',buildSvg);
</script>
