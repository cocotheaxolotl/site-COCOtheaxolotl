<script>
const PUZZLES = [
  {
    title: '🌊 Axolotl',
    grid: [
      ['C','O','C','O','F','T','K','P','M','V','N','Z'],
      ['X','B','D','H','W','L','Q','Z','T','Y','J','A'],
      ['P','F','M','K','Z','V','J','R','O','S','E','M'],
      ['T','N','V','Q','G','W','X','B','D','K','H','I'],
      ['Z','N','A','G','E','R','P','L','T','X','M','S'],
      ['K','D','V','X','P','T','F','W','N','C','B','Q'],
      ['M','H','Z','T','K','B','J','O','U','E','R','V'],
      ['B','P','R','F','G','K','X','W','D','N','L','T'],
      ['L','Q','I','L','I','V','R','E','K','Z','X','P'],
      ['E','M','R','N','B','W','D','T','F','H','V','K'],
      ['U','Z','E','B','Z','Q','U','E','U','E','Y','P'],
      ['W','N','X','K','D','P','M','L','T','B','F','V'],
    ],
    words: [
      { word: 'COCO',  cells: [[0,0],[0,1],[0,2],[0,3]] },
      { word: 'ROSE',  cells: [[2,7],[2,8],[2,9],[2,10]] },
      { word: 'NAGER', cells: [[4,1],[4,2],[4,3],[4,4],[4,5]] },
      { word: 'JOUER', cells: [[6,6],[6,7],[6,8],[6,9],[6,10]] },
      { word: 'AMIS',  cells: [[1,11],[2,11],[3,11],[4,11]] },
      { word: 'LIVRE', cells: [[8,3],[8,4],[8,5],[8,6],[8,7]] },
      { word: 'QUEUE', cells: [[10,5],[10,6],[10,7],[10,8],[10,9]] },
      { word: 'RIRE',  cells: [[7,2],[8,2],[9,2],[10,2]] },
      { word: 'BLEU',  cells: [[7,0],[8,0],[9,0],[10,0]] },
    ]
  },
  {
    title: '🌊 Océan',
    grid: [
      ['M','E','R','K','P','T','B','N','V','Z','X','W'],
      ['D','B','X','F','T','N','P','Z','M','V','K','Y'],
      ['Q','H','L','V','A','G','U','E','T','X','B','F'],
      ['P','F','Z','E','K','M','N','T','D','B','V','W'],
      ['X','T','N','M','U','K','D','C','R','A','B','E'],
      ['V','K','B','D','Z','T','M','P','N','F','H','Q'],
      ['S','D','X','T','P','N','A','G','E','R','V','B'],
      ['A','M','Z','K','B','D','T','N','P','X','F','H'],
      ['B','P','V','N','T','K','M','Z','D','Q','X','F'],
      ['L','F','M','D','P','L','A','G','E','X','B','T'],
      ['E','N','K','T','B','M','V','D','Z','P','F','W'],
      ['P','O','I','S','S','O','N','K','T','B','D','X'],
    ],
    words: [
      { word: 'MER',     cells: [[0,0],[0,1],[0,2]] },
      { word: 'VAGUE',   cells: [[2,3],[2,4],[2,5],[2,6],[2,7]] },
      { word: 'CRABE',   cells: [[4,7],[4,8],[4,9],[4,10],[4,11]] },
      { word: 'SABLE',   cells: [[6,0],[7,0],[8,0],[9,0],[10,0]] },
      { word: 'NAGER',   cells: [[6,5],[6,6],[6,7],[6,8],[6,9]] },
      { word: 'BLEU',    cells: [[1,1],[2,2],[3,3],[4,4]] },
      { word: 'PLAGE',   cells: [[9,4],[9,5],[9,6],[9,7],[9,8]] },
      { word: 'POISSON', cells: [[11,0],[11,1],[11,2],[11,3],[11,4],[11,5],[11,6]] },
    ]
  },
  {
    title: '🐾 Animaux',
    grid: [
      ['C','H','A','T','M','Z','K','P','B','V','N','X'],
      ['D','F','T','B','Z','P','V','C','H','I','E','N'],
      ['K','M','X','V','N','T','B','Z','D','P','F','Q'],
      ['C','A','N','A','R','D','X','M','T','B','V','O'],
      ['Z','P','T','D','M','B','V','K','N','X','F','U'],
      ['B','X','K','V','Z','T','P','D','M','N','Q','R'],
      ['L','I','O','N','T','X','K','B','V','M','Z','S'],
      ['D','V','P','X','T','M','L','K','B','Z','N','F'],
      ['M','T','B','K','Z','N','A','D','L','O','U','P'],
      ['X','D','V','F','T','B','P','M','Z','K','N','T'],
      ['O','I','S','E','A','U','I','X','T','B','D','K'],
      ['T','B','X','K','V','D','N','P','M','Z','T','F'],
    ],
    words: [
      { word: 'CHAT',   cells: [[0,0],[0,1],[0,2],[0,3]] },
      { word: 'CHIEN',  cells: [[1,7],[1,8],[1,9],[1,10],[1,11]] },
      { word: 'CANARD', cells: [[3,0],[3,1],[3,2],[3,3],[3,4],[3,5]] },
      { word: 'OURS',   cells: [[3,11],[4,11],[5,11],[6,11]] },
      { word: 'LION',   cells: [[6,0],[6,1],[6,2],[6,3]] },
      { word: 'LOUP',   cells: [[8,8],[8,9],[8,10],[8,11]] },
      { word: 'LAPIN',  cells: [[7,6],[8,6],[9,6],[10,6],[11,6]] },
      { word: 'OISEAU', cells: [[10,0],[10,1],[10,2],[10,3],[10,4],[10,5]] },
    ]
  }
];

const WIN_MSGS = ['Tu les as tous trouvés ! 🌟','Tu es une étoile ! ⭐','Incroyable ! 🎉','Quelle intelligence ! 🦋','Youpi ! 🌈'];
let currentPuzzleIdx = 0, foundWords = new Set(), selecting = false, startCell = null, currentCells = [], cellEls = [];

function loadPuzzle(idx) {
  currentPuzzleIdx = idx; foundWords = new Set(); selecting = false; startCell = null; currentCells = [];
  document.getElementById('win-overlay').classList.remove('show');
  buildGrid(); updatePuzzleButtons();
}
function updatePuzzleButtons() {
  document.querySelectorAll('.puzzle-btn').forEach((btn, i) => btn.classList.toggle('active', i === currentPuzzleIdx));
  document.getElementById('next-btn').style.display = currentPuzzleIdx >= PUZZLES.length - 1 ? 'none' : '';
}
function buildPuzzleSelector() {
  const sel = document.getElementById('puzzle-selector');
  PUZZLES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'puzzle-btn' + (i === currentPuzzleIdx ? ' active' : '');
    btn.type = 'button'; btn.textContent = p.title;
    btn.onclick = () => loadPuzzle(i);
    sel.appendChild(btn);
  });
}
function buildGrid() {
  const puzzle = PUZZLES[currentPuzzleIdx], grid = document.getElementById('grid');
  grid.innerHTML = ''; cellEls = [];
  for(let r = 0; r < 12; r++) {
    cellEls[r] = [];
    for(let c = 0; c < 12; c++) {
      const el = document.createElement('div');
      el.className = 'cell'; el.textContent = puzzle.grid[r][c];
      grid.appendChild(el); cellEls[r][c] = el;
    }
  }
  buildWordList(); buildSvg();
  if(!grid._eventsSet) { setupEvents(); grid._eventsSet = true; }
}
function buildWordList() {
  const wl = document.getElementById('word-list'); wl.innerHTML = '';
  PUZZLES[currentPuzzleIdx].words.forEach((w, i) => {
    const el = document.createElement('div');
    el.className = 'word-item'; el.id = 'word-'+i; el.textContent = w.word; wl.appendChild(el);
  });
}
function buildSvg() {
  const puzzle = PUZZLES[currentPuzzleIdx], svg = document.getElementById('svg-overlay'), grid = document.getElementById('grid');
  const w = grid.offsetWidth, h = grid.offsetHeight;
  svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.innerHTML = '';
  const cs = w/12, colors = ['#ff69b4','#f4a0c8','#e87bbf','#d955a8','#f08fc0','#c94499','#e066b3','#f77dc2','#dc4da6'];
  puzzle.words.forEach((wd, i) => {
    if(!foundWords.has(i)) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    const [r1,c1]=wd.cells[0],[r2,c2]=wd.cells[wd.cells.length-1];
    line.setAttribute('x1',(c1+.5)*cs); line.setAttribute('y1',(r1+.5)*cs);
    line.setAttribute('x2',(c2+.5)*cs); line.setAttribute('y2',(r2+.5)*cs);
    line.setAttribute('stroke',colors[i%colors.length]); line.setAttribute('stroke-width',cs*.72);
    line.setAttribute('class','found-line'); svg.appendChild(line);
  });
}
function getCellFromPoint(x,y) {
  const rect = document.getElementById('grid').getBoundingClientRect(), cs = rect.width/12;
  const c = Math.floor((x-rect.left)/cs), r = Math.floor((y-rect.top)/cs);
  return (r>=0&&r<12&&c>=0&&c<12) ? [r,c] : null;
}
function getCellsInLine(r1,c1,r2,c2) {
  const dr=r2-r1,dc=c2-c1;
  if(!dr&&!dc) return [[r1,c1]];
  if(dr&&dc&&Math.abs(dr)!==Math.abs(dc)) {
    if(Math.abs(dr)>Math.abs(dc)){const a=[],s=dr>0?1:-1;for(let r=r1;r!==r2+s;r+=s)a.push([r,c1]);return a;}
    else{const a=[],s=dc>0?1:-1;for(let c=c1;c!==c2+s;c+=s)a.push([r1,c]);return a;}
  }
  const steps=Math.max(Math.abs(dr),Math.abs(dc)),sr=dr?dr>0?1:-1:0,sc=dc?dc>0?1:-1:0,a=[];
  for(let i=0;i<=steps;i++)a.push([r1+i*sr,c1+i*sc]);
  return a;
}
function clearSelection() {
  currentCells.forEach(([r,c])=>{if(cellEls[r]&&cellEls[r][c]&&!cellEls[r][c].classList.contains('found'))cellEls[r][c].classList.remove('selecting');});
  currentCells=[];
}
function updateSelection(cells) {
  clearSelection(); currentCells=cells;
  cells.forEach(([r,c])=>{if(!cellEls[r][c].classList.contains('found'))cellEls[r][c].classList.add('selecting');});
}
function checkWord(cells) {
  const puzzle=PUZZLES[currentPuzzleIdx],str=cells.map(([r,c])=>puzzle.grid[r][c]).join(''),rev=str.split('').reverse().join('');
  for(let i=0;i<puzzle.words.length;i++){
    if(foundWords.has(i))continue;
    const t=puzzle.words[i].word;
    if(str!==t&&rev!==t)continue;
    const sel=cells.map(([r,c])=>r+','+c).join('|'),fwd=puzzle.words[i].cells.map(([r,c])=>r+','+c).join('|'),bwd=[...puzzle.words[i].cells].reverse().map(([r,c])=>r+','+c).join('|');
    if(sel===fwd||sel===bwd)return i;
  }
  return -1;
}
function markFound(idx) {
  foundWords.add(idx);
  PUZZLES[currentPuzzleIdx].words[idx].cells.forEach(([r,c])=>{cellEls[r][c].classList.remove('selecting');cellEls[r][c].classList.add('found','word-'+idx);});
  document.getElementById('word-'+idx).classList.add('found');
  buildSvg();
  if(foundWords.size===PUZZLES[currentPuzzleIdx].words.length){
    document.getElementById('win-msg').textContent=WIN_MSGS[currentPuzzleIdx%WIN_MSGS.length];
    setTimeout(()=>document.getElementById('win-overlay').classList.add('show'),400);
  }
}
function setupEvents() {
  const grid = document.getElementById('grid');
  grid.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],cell=getCellFromPoint(t.clientX,t.clientY);if(!cell)return;selecting=true;startCell=cell;updateSelection([cell]);},{passive:false});
  grid.addEventListener('touchmove',e=>{e.preventDefault();if(!selecting)return;const t=e.touches[0],cell=getCellFromPoint(t.clientX,t.clientY);if(!cell)return;updateSelection(getCellsInLine(startCell[0],startCell[1],cell[0],cell[1]));},{passive:false});
  grid.addEventListener('touchend',e=>{e.preventDefault();if(!selecting)return;selecting=false;const idx=checkWord(currentCells);if(idx>=0)markFound(idx);else clearSelection();currentCells=[];startCell=null;},{passive:false});
  grid.addEventListener('mousedown',e=>{const cell=getCellFromPoint(e.clientX,e.clientY);if(!cell)return;selecting=true;startCell=cell;updateSelection([cell]);});
  grid.addEventListener('mousemove',e=>{if(!selecting)return;const cell=getCellFromPoint(e.clientX,e.clientY);if(!cell)return;updateSelection(getCellsInLine(startCell[0],startCell[1],cell[0],cell[1]));});
  grid.addEventListener('mouseup',()=>{if(!selecting)return;selecting=false;const idx=checkWord(currentCells);if(idx>=0)markFound(idx);else clearSelection();currentCells=[];startCell=null;});
  document.addEventListener('mouseup',()=>{if(selecting){selecting=false;clearSelection();currentCells=[];startCell=null;}});
}
function resetGame(){loadPuzzle(currentPuzzleIdx);}
function nextPuzzle(){if(currentPuzzleIdx<PUZZLES.length-1)loadPuzzle(currentPuzzleIdx+1);}
buildPuzzleSelector(); loadPuzzle(0);
window.addEventListener('resize',buildSvg);
</script>
