<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200">
  <defs>
    <linearGradient id="woodMain" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="25%" stop-color="#c4956a"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="75%" stop-color="#b8865a"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0714a"/>
      <stop offset="100%" stop-color="#7d5a3a"/>
    </linearGradient>
    <linearGradient id="woodBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6b45"/>
      <stop offset="100%" stop-color="#6d5235"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="4" stroke="#b8865a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <clipPath id="letterClip">
      <text x="90" y="150" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="150" font-weight="900">A</text>
    </clipPath>
  </defs>

  <!-- 3D depth - side -->
  <text x="96" y="158" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="150" font-weight="900" fill="url(#woodBottom)">A</text>

  <!-- 3D depth - middle layer -->
  <text x="93" y="154" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="150" font-weight="900" fill="url(#woodSide)">A</text>

  <!-- Main letter - wood face -->
  <text x="90" y="150" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="150" font-weight="900" fill="url(#woodMain)" stroke="#6d5235" stroke-width="2" paint-order="stroke">A</text>

  <!-- Wood grain overlay -->
  <g clip-path="url(#letterClip)">
    <rect x="0" y="0" width="180" height="200" fill="url(#grain)"/>
    <!-- Horizontal grain lines -->
    <line x1="30" y1="50" x2="150" y2="52" stroke="#b8865a" stroke-width="0.8" opacity="0.35"/>
    <line x1="25" y1="75" x2="155" y2="74" stroke="#a0714a" stroke-width="0.6" opacity="0.3"/>
    <line x1="35" y1="100" x2="145" y2="101" stroke="#b8865a" stroke-width="0.7" opacity="0.3"/>
    <line x1="30" y1="125" x2="150" y2="124" stroke="#a0714a" stroke-width="0.6" opacity="0.25"/>
    <line x1="40" y1="62" x2="140" y2="63" stroke="#c4956a" stroke-width="0.5" opacity="0.2"/>
    <line x1="35" y1="88" x2="145" y2="87" stroke="#c4956a" stroke-width="0.5" opacity="0.2"/>
    <line x1="30" y1="112" x2="150" y2="113" stroke="#c4956a" stroke-width="0.5" opacity="0.2"/>
    <line x1="35" y1="140" x2="145" y2="139" stroke="#a0714a" stroke-width="0.6" opacity="0.25"/>
    <!-- Knot -->
    <ellipse cx="75" cy="90" rx="6" ry="4" fill="none" stroke="#8b6b45" stroke-width="1" opacity="0.4"/>
    <ellipse cx="120" cy="130" rx="5" ry="3" fill="none" stroke="#8b6b45" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Nails -->
  <circle cx="65" cy="45" r="3.5" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="65" cy="45" r="1.5" fill="#aaa"/>
  <circle cx="115" cy="45" r="3.5" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="115" cy="45" r="1.5" fill="#aaa"/>
  <circle cx="52" cy="148" r="3.5" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="52" cy="148" r="1.5" fill="#aaa"/>
  <circle cx="128" cy="148" r="3.5" fill="#888" stroke="#555" stroke-width="1"/>
  <circle cx="128" cy="148" r="1.5" fill="#aaa"/>

  <!-- Top highlight -->
  <text x="90" y="150" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="150" font-weight="900" fill="none" stroke="#e8c99b" stroke-width="1" opacity="0.3">A</text>
</svg>
