<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coco ne dort pas ce soir !</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Georgia, serif;
            overflow: hidden;
        }

        h1 {
            color: #f0e6d3;
            font-size: 1.4rem;
            margin: 8px 0;
            text-align: center;
        }

        /* ---- BOOK ---- */
        .flipbook-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .spread-view {
            display: flex;
            width: 800px;
            height: 540px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .spread-view .page-side {
            width: 50%;
            height: 100%;
            overflow: hidden;
        }

        .spread-view .page-side img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #111;
        }

        .spread-view .page-left { border-right: 1px solid rgba(0,0,0,0.3); }

        /* Spine shadow */
        .spread-view::after {
            content: '';
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 30px; height: 100%;
            background: linear-gradient(to right,
                rgba(0,0,0,0.15), rgba(0,0,0,0.02) 30%,
                rgba(0,0,0,0) 50%, rgba(0,0,0,0.02) 70%,
                rgba(0,0,0,0.15));
            pointer-events: none; z-index: 30;
        }

        /* Page turn animation overlay */
        .turn-overlay {
            position: absolute;
            top: 0; width: 50%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 20;
        }
        .turn-overlay.right { right: 0; transform-origin: left center; }
        .turn-overlay.left  { left: 0;  transform-origin: right center; }
        .turn-overlay .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; overflow: hidden;
        }
        .turn-overlay .face.back { transform: rotateY(180deg); }
        .turn-overlay .face img {
            width: 100%; height: 100%;
            object-fit: contain; background: #111;
        }
        .turn-overlay.flip-right { transform: rotateY(-180deg); }
        .turn-overlay.flip-left  { transform: rotateY(180deg); }

        /* ---- NAV BUTTONS ---- */
        .nav-btn {
            background: rgba(240,230,211,0.15);
            border: 2px solid rgba(240,230,211,0.3);
            color: #f0e6d3; font-size: 2rem;
            width: 48px; height: 48px; border-radius: 50%;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            transition: all 0.3s; user-select: none;
        }
        .nav-btn:hover { background: rgba(240,230,211,0.3); }
        .nav-btn:disabled { opacity: 0.2; cursor: default; }

        /* ---- AUDIO CONTROLS ---- */
        .audio-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            background: rgba(240,230,211,0.08);
            padding: 8px 20px;
            border-radius: 30px;
        }

        .audio-btn {
            background: none; border: none;
            color: #f0e6d3; font-size: 1.5rem;
            cursor: pointer; padding: 4px 8px;
            border-radius: 8px; transition: background 0.2s;
        }
        .audio-btn:hover { background: rgba(240,230,211,0.15); }
        .audio-btn.active { color: #f7c948; }

        .progress-wrap {
            flex: 1; min-width: 200px;
            height: 6px; background: rgba(240,230,211,0.15);
            border-radius: 3px; cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%; background: #f7c948;
            border-radius: 3px; width: 0;
            transition: width 0.1s linear;
        }

        .time-label {
            color: #8a7f72; font-size: 0.8rem;
            min-width: 45px; text-align: center;
        }

        .page-info {
            color: #8a7f72; font-size: 0.85rem;
        }

        /* Auto-play indicator */
        .auto-indicator {
            display: none;
            color: #f7c948;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .auto-indicator.visible { display: inline; }

        @media (max-width: 850px) {
            .spread-view { width: 95vw; height: calc(95vw * 0.675); }
            h1 { font-size: 1.1rem; }
            .audio-bar { padding: 6px 12px; gap: 8px; }
        }

</head>
<body>
    <h1>Coco ne dort pas ce soir !</h1>

    
<p class="us-flip-credit">Flipbook created with <a href="https://www.univers.studio/flipbook/" target="_blank" rel="noopener">Univers Studio</a>.</p>
<div class="flipbook-container">
        <button class="nav-btn" id="prevBtn" title="Page precedente">&#8249;</button>

        <div class="spread-view" id="book">
            <div class="page-side page-left"><img id="imgLeft" src="" alt=""></div>
            <div class="page-side page-right"><img id="imgRight" src="" alt=""></div>
        </div>

        <button class="nav-btn" id="nextBtn" title="Page suivante">&#8250;</button>
    </div>

    <!-- Audio controls -->
    <div class="audio-bar">
        <button class="audio-btn" id="playBtn" title="Lecture / Pause">&#9654;&#65039;</button>
        <button class="audio-btn" id="autoBtn" title="Tourne-page automatique">&#128214;</button>
        <span class="auto-indicator" id="autoLabel">AUTO</span>
        <span class="time-label" id="timeNow">0:00</span>
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-label" id="timeTotal">0:00</span>
        <span class="page-info" id="pageInfo">1 / 30</span>
    </div>

    <audio id="narrator" preload="auto"></audio>

    <script>
    // ---- CONFIG ----
    const TOTAL_PAGES = 30;
    const TOTAL_SPREADS = 15;

    const pages = [];
    for (let i = 1; i <= TOTAL_PAGES; i++) {
        pages.push(`page_${String(i).padStart(2, '0')}.jpg`);
    }

    // Duration of each spread's audio (seconds)
    const durations = [11.09, 24.89, 16.94, 32.69, 34.66, 30.00, 35.86, 31.44, 30.38, 33.86, 30.29, 32.54, 32.57, 32.88, 18.84];
    const totalDuration = durations.reduce((a, b) => a + b, 0);

    // Cumulative start times (for progress bar display)
    const cumulativeStarts = [];
    let cum = 0;
    for (const d of durations) { cumulativeStarts.push(cum); cum += d; }

    // ---- STATE ----
    let currentSpread = 0;
    let isAnimating = false;
    let autoTurn = true;
    let isPlaying = false;

    // ---- DOM ----
    const audio     = document.getElementById('narrator');
    const imgLeft   = document.getElementById('imgLeft');
    const imgRight  = document.getElementById('imgRight');
    const book      = document.getElementById('book');
    const prevBtn   = document.getElementById('prevBtn');
    const nextBtn   = document.getElementById('nextBtn');
    const playBtn   = document.getElementById('playBtn');
    const autoBtn   = document.getElementById('autoBtn');
    const autoLabel = document.getElementById('autoLabel');
    const timeNow   = document.getElementById('timeNow');
    const timeTotal = document.getElementById('timeTotal');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const pageInfo  = document.getElementById('pageInfo');

    // ---- HELPERS ----
    function fmtTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${String(sec).padStart(2, '0')}`;
    }

    function spreadAudioSrc(sp) {
        return `audio/spread_${String(sp).padStart(2, '0')}.mp3`;
    }

    function spreadPages(sp) {
        const l = sp * 2;
        const r = sp * 2 + 1;
        return {
            leftSrc:  l < TOTAL_PAGES ? pages[l] : null,
            rightSrc: r < TOTAL_PAGES ? pages[r] : null
        };
    }

    function globalTime() {
        return cumulativeStarts[currentSpread] + (audio.currentTime || 0);
    }

    // ---- AUDIO ----
    function loadSpreadAudio(sp) {
        audio.src = spreadAudioSrc(sp);
        audio.load();
    }

    function playSpread(sp) {
        loadSpreadAudio(sp);
        audio.play();
        isPlaying = true;
        playBtn.innerHTML = '&#9646;&#9646;';
    }

    function togglePlay() {
        if (audio.paused) {
            if (!audio.src || audio.src === location.href) {
                loadSpreadAudio(currentSpread);
            }
            audio.play();
            isPlaying = true;
            playBtn.innerHTML = '&#9646;&#9646;';
        } else {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '&#9654;&#65039;';
        }
    }

    function toggleAuto() {
        autoTurn = !autoTurn;
        autoBtn.classList.toggle('active', autoTurn);
        autoLabel.classList.toggle('visible', autoTurn);
    }

    // When spread audio ends, auto-advance to next spread
    audio.addEventListener('ended', () => {
        if (autoTurn && currentSpread < TOTAL_SPREADS - 1) {
            showSpread(currentSpread + 1, true, 'next');
            // Start next spread's audio after page turn animation (0.8s)
            setTimeout(() => {
                playSpread(currentSpread);
            }, 800);
        } else {
            isPlaying = false;
            playBtn.innerHTML = '&#9654;&#65039;';
        }
    });

    // Update progress bar
    audio.addEventListener('timeupdate', () => {
        const gt = globalTime();
        progressFill.style.width = `${(gt / totalDuration) * 100}%`;
        timeNow.textContent = fmtTime(gt);
    });

    audio.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = fmtTime(totalDuration);
    });

    // Click on progress bar to seek to a spread
    progressWrap.addEventListener('click', (e) => {
        const rect = progressWrap.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const targetTime = pct * totalDuration;

        // Find which spread this falls into
        let targetSpread = 0;
        for (let i = TOTAL_SPREADS - 1; i >= 0; i--) {
            if (targetTime >= cumulativeStarts[i]) {
                targetSpread = i;
                break;
            }
        }

        const offsetInSpread = targetTime - cumulativeStarts[targetSpread];

        if (targetSpread !== currentSpread) {
            const dir = targetSpread > currentSpread ? 'next' : 'prev';
            showSpread(targetSpread, false);
        }

        loadSpreadAudio(targetSpread);
        audio.currentTime = offsetInSpread;
        if (isPlaying) audio.play();
    });

    // When user manually turns page, sync audio
    function syncAudioToSpread(sp) {
        if (isPlaying) {
            playSpread(sp);
        } else {
            loadSpreadAudio(sp);
        }
    }

    // ---- DISPLAY ----
    function showSpread(sp, animate = false, direction = 'next') {
        if (isAnimating || sp < 0 || sp >= TOTAL_SPREADS) return;
        if (sp === currentSpread && animate) return;

        const next = spreadPages(sp);

        if (!animate) {
            imgLeft.src  = next.leftSrc || '';
            imgRight.src = next.rightSrc || '';
            imgLeft.parentElement.style.visibility  = next.leftSrc ? '' : 'hidden';
            imgRight.parentElement.style.visibility = next.rightSrc ? '' : 'hidden';
            currentSpread = sp;
            updateUI();
            return;
        }

        isAnimating = true;
        const old = spreadPages(currentSpread);

        const turner = document.createElement('div');
        turner.className = 'turn-overlay';

        const front = document.createElement('div');
        const back  = document.createElement('div');
        const fImg  = document.createElement('img');
        const bImg  = document.createElement('img');
        front.className = 'face';
        back.className  = 'face back';

        if (direction === 'next') {
            turner.classList.add('right');
            fImg.src = old.rightSrc || '';
            bImg.src = next.leftSrc || '';
            imgRight.src = next.rightSrc || '';
            imgRight.parentElement.style.visibility = next.rightSrc ? '' : 'hidden';
        } else {
            turner.classList.add('left');
            fImg.src = old.leftSrc || '';
            bImg.src = next.rightSrc || '';
            imgLeft.src = next.leftSrc || '';
            imgLeft.parentElement.style.visibility = next.leftSrc ? '' : 'hidden';
        }

        front.appendChild(fImg);
        back.appendChild(bImg);
        turner.appendChild(front);
        turner.appendChild(back);
        book.appendChild(turner);

        requestAnimationFrame(() => requestAnimationFrame(() => {
            turner.classList.add(direction === 'next' ? 'flip-right' : 'flip-left');
        }));

        turner.addEventListener('transitionend', () => {
            imgLeft.src  = next.leftSrc || '';
            imgRight.src = next.rightSrc || '';
            imgLeft.parentElement.style.visibility  = next.leftSrc ? '' : 'hidden';
            imgRight.parentElement.style.visibility = next.rightSrc ? '' : 'hidden';
            currentSpread = sp;
            turner.remove();
            isAnimating = false;
            updateUI();
        });
    }

    function nextPage() {
        if (currentSpread < TOTAL_SPREADS - 1 && !isAnimating)
            showSpread(currentSpread + 1, true, 'next');
    }

    function prevPage() {
        if (currentSpread > 0 && !isAnimating)
            showSpread(currentSpread - 1, true, 'prev');
    }

    function updateUI() {
        const l = currentSpread * 2 + 1;
        const r = Math.min(currentSpread * 2 + 2, TOTAL_PAGES);
        pageInfo.textContent = l === r ? `${l} / ${TOTAL_PAGES}` : `${l}-${r} / ${TOTAL_PAGES}`;
        prevBtn.disabled = currentSpread === 0;
        nextBtn.disabled = currentSpread >= TOTAL_SPREADS - 1;
    }

    // ---- EVENT LISTENERS ----
    playBtn.addEventListener('click', togglePlay);
    autoBtn.addEventListener('click', toggleAuto);

    function goNext() {
        if (currentSpread < TOTAL_SPREADS - 1 && !isAnimating) {
            const target = currentSpread + 1;
            nextPage();
            syncAudioToSpread(target);
        }
    }

    function goPrev() {
        if (currentSpread > 0 && !isAnimating) {
            const target = currentSpread - 1;
            prevPage();
            syncAudioToSpread(target);
        }
    }

    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    // Click left/right side of book
    book.addEventListener('click', (e) => {
        const rect = book.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width / 2) goPrev(); else goNext();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            if (e.key === ' ') { togglePlay(); return; }
            goNext();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            goPrev();
        }
    });

    // Touch swipe
    let touchX = 0;
    book.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; });
    book.addEventListener('touchend', (e) => {
        const diff = touchX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) goNext(); else goPrev();
        }
    });

    // Preload images
    pages.forEach(src => { new Image().src = src; });

    // Init
    autoBtn.classList.add('active');
    autoLabel.classList.add('visible');
    showSpread(0);
    loadSpreadAudio(0);
    timeTotal.textContent = fmtTime(totalDuration);
    </script>
</body>
</html>
