name: Create Stripe Payment Link

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "Nom du produit (ex: Coco - Coloriage Autumn PDF)"
        required: true
        type: string
      description:
        description: "Description courte du produit"
        required: true
        type: string
      price_cents:
        description: "Prix en centimes d'euro (ex: 299 pour 2,99 €)"
        required: true
        type: string
      image_url:
        description: "URL complète de l'image/preview (ex: https://www.cocotheaxolotl.org/shop/coloring-preview.gif)"
        required: true
        type: string
      redirect_url:
        description: "URL complète du PDF à délivrer après paiement"
        required: true
        type: string
      currency:
        description: "Devise"
        required: false
        default: "eur"
        type: choice
        options:
          - eur
          - usd

jobs:
  create-link:
    runs-on: ubuntu-latest
    steps:
      - name: Create Stripe product, price and payment link
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          DESCRIPTION: ${{ inputs.description }}
          PRICE_CENTS: ${{ inputs.price_cents }}
          IMAGE_URL: ${{ inputs.image_url }}
          REDIRECT_URL: ${{ inputs.redirect_url }}
          CURRENCY: ${{ inputs.currency }}
        run: |
          set -e
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "Creating product: $PRODUCT_NAME"
          PRODUCT_RESP=$(curl -sS https://api.stripe.com/v1/products \
            -u "$STRIPE_SECRET_KEY:" \
            --data-urlencode "name=$PRODUCT_NAME" \
            --data-urlencode "description=$DESCRIPTION" \
            --data-urlencode "images[]=$IMAGE_URL")
          PRODUCT_ID=$(echo "$PRODUCT_RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''));err=d.get('error',{}).get('message');sys.stderr.write(err+'\n') if err else None" 2>&1)
          if [ -z "$PRODUCT_ID" ] || [ "${PRODUCT_ID:0:5}" != "prod_" ]; then
            echo "::error::Product creation failed: $PRODUCT_ID"
            exit 1
          fi
          echo "  product_id=$PRODUCT_ID"

          echo "Creating price: $PRICE_CENTS $CURRENCY"
          PRICE_RESP=$(curl -sS https://api.stripe.com/v1/prices \
            -u "$STRIPE_SECRET_KEY:" \
            -d "product=$PRODUCT_ID" \
            -d "unit_amount=$PRICE_CENTS" \
            -d "currency=$CURRENCY")
          PRICE_ID=$(echo "$PRICE_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          if [ -z "$PRICE_ID" ] || [ "${PRICE_ID:0:6}" != "price_" ]; then
            echo "::error::Price creation failed: $PRICE_RESP"
            exit 1
          fi
          echo "  price_id=$PRICE_ID"

          echo "Creating payment link with redirect to $REDIRECT_URL"
          LINK_RESP=$(curl -sS https://api.stripe.com/v1/payment_links \
            -u "$STRIPE_SECRET_KEY:" \
            -d "line_items[0][price]=$PRICE_ID" \
            -d "line_items[0][quantity]=1" \
            -d "after_completion[type]=redirect" \
            --data-urlencode "after_completion[redirect][url]=$REDIRECT_URL")
          LINK_URL=$(echo "$LINK_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('url',''))")
          LINK_ID=$(echo "$LINK_RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          if [ -z "$LINK_URL" ]; then
            echo "::error::Payment link creation failed: $LINK_RESP"
            exit 1
          fi

          {
            echo "## Stripe Payment Link created"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Product | $PRODUCT_NAME |"
            echo "| Price | $PRICE_CENTS $CURRENCY |"
            echo "| Product ID | \`$PRODUCT_ID\` |"
            echo "| Price ID | \`$PRICE_ID\` |"
            echo "| Payment Link ID | \`$LINK_ID\` |"
            echo "| **Payment URL** | **$LINK_URL** |"
            echo "| Post-purchase redirect | $REDIRECT_URL |"
            echo ""
            echo "Paste this URL into the \`href\` of the shop \`.btn-buy\` button."
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Payment Link URL: $LINK_URL"
