name: Update image list

on:
  push:
    paths:
      - 'puzzle/images/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate puzzle/images/index.json
        run: |
          python3 -c "
          import os, json
          exts = {'.jpg','.jpeg','.png','.webp'}
          folder = 'puzzle/images'
          images = sorted([f for f in os.listdir(folder) if os.path.splitext(f)[1].lower() in exts])
          with open(folder + '/index.json', 'w', encoding='utf-8') as f:
              json.dump(images, f, ensure_ascii=False, indent=2)
          print(str(len(images)) + ' images')
          "

      - name: Commit index.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzle/images/index.json
          git diff --cached --quiet || git commit -m "auto: update puzzle image list"
          git push
