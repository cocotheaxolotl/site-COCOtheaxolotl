name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static output
        run: npm run build:cloudflare

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create cocotheaxolotl --production-branch=master

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cocotheaxolotl --branch=${{ github.ref_name }}

      - name: Purge removed freebies from Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          zone_id="${CLOUDFLARE_ZONE_ID:-${CF_ZONE_ID:-}}"
          if [ -z "$zone_id" ]; then
            zone_id="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?name=cocotheaxolotl.org" \
              | python3 -c "import sys,json; data=json.load(sys.stdin); result=data.get('result') or []; print(result[0]['id'] if result else '')")"
          fi
          if [ -z "$zone_id" ]; then
            echo "::error::Cloudflare zone id was not found. Add CLOUDFLARE_ZONE_ID or CF_ZONE_ID as a repository secret."
            exit 1
          fi
          pack_file="$(printf '%s-%s-%s-%s-%s.%s' coco dot to dot pack pdf)"
          preview_file="$(printf '%s-%s-%s-%s-%s.%s' coco dot to dot preview gif)"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[\"https://cocotheaxolotl.org/freebies/$pack_file\",\"https://cocotheaxolotl.org/freebies/$preview_file\",\"https://www.cocotheaxolotl.org/freebies/$pack_file\",\"https://www.cocotheaxolotl.org/freebies/$preview_file\"]}"
