name: List Stripe Payment Links

on:
  workflow_dispatch:
    inputs:
      noop:
        description: "(leave empty)"
        required: false
        default: ""

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and format payment links
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -e
          curl -sS "https://api.stripe.com/v1/payment_links?limit=50&active=true" \
            -u "$STRIPE_SECRET_KEY:" > /tmp/resp.json

          cat > /tmp/fmt.py <<'PY'
          import json
          with open('/tmp/resp.json') as f:
              d = json.load(f)
          if d.get('error'):
              print('ERROR:', d['error'].get('message'))
              raise SystemExit(1)
          rows = []
          for l in d.get('data', []):
              rid = l.get('id', '')
              url = l.get('url', '')
              ac = l.get('after_completion', {}) or {}
              redir = ''
              if ac.get('type') == 'redirect':
                  redir = (ac.get('redirect') or {}).get('url', '')
              else:
                  redir = ac.get('type', '')
              rows.append((rid, url, redir))
          with open('/tmp/summary.md', 'w') as f:
              f.write('## Active Payment Links\n\n')
              f.write('| ID | URL | Redirect |\n|---|---|---|\n')
              for rid, url, redir in rows:
                  f.write(f'| `{rid}` | {url} | {redir} |\n')
          for rid, url, redir in rows:
              print(rid, url, redir)
          PY

          python3 /tmp/fmt.py
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
