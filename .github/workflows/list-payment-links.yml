name: List Stripe Payment Links

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List active payment links
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -e
          RESP=$(curl -sS "https://api.stripe.com/v1/payment_links?limit=50&active=true" \
            -u "$STRIPE_SECRET_KEY:")
          {
            echo "## Active Payment Links"
            echo ""
            echo "| ID | URL | Redirect URL |"
            echo "|---|---|---|"
            echo "$RESP" | python3 -c "
import sys, json
d = json.load(sys.stdin)
for l in d.get('data', []):
    rid = l.get('id','')
    url = l.get('url','')
    ac = l.get('after_completion',{})
    redir = ac.get('redirect',{}).get('url','') if ac.get('type')=='redirect' else ac.get('type','')
    print(f'| \`{rid}\` | {url} | {redir} |')
"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESP" | python3 -c "
import sys, json
d = json.load(sys.stdin)
for l in d.get('data', []):
    print(l.get('id',''), l.get('url',''), (l.get('after_completion',{}).get('redirect',{}) or {}).get('url',''))
"
