<style>
  :root{
    --pink:#ff69b4;
    --pink2:#f7c1cc;
    --bg:#fef6fb;
    --shadow:0 6px 20px rgba(255,105,180,.15);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Baloo 2',cursive;
    background:var(--bg);
    color:#333;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ── Header ── */
  header{
    background:var(--pink2);
    width:100%;
    padding:14px 18px 12px;
    text-align:center;
  }
  header a.back{
    display:inline-block;
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:.88em;
    opacity:.85;
    margin-bottom:4px;
  }
  header a.back:hover{ opacity:1 }
  header h1{
    font-size:1.8em;
    color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.18);
    line-height:1.1;
  }

  /* ── Difficulty selector ── */
  .diff-row{
    display:flex;
    gap:8px;
    justify-content:center;
    padding:12px 16px 6px;
    flex-wrap:wrap;
  }
  .diff-btn{
    font-family:'Baloo 2',cursive;
    font-size:.9em;
    font-weight:800;
    border:2px solid var(--pink);
    border-radius:32px;
    padding:6px 18px;
    cursor:pointer;
    background:#fff;
    color:var(--pink);
    transition:background .15s, color .15s;
  }
  .diff-btn.active, .diff-btn:hover{
    background:var(--pink);
    color:#fff;
  }

  /* ── Stats bar ── */
  .stats{
    display:flex;
    gap:16px;
    justify-content:center;
    padding:4px 16px 10px;
    font-size:1em;
    font-weight:800;
    color:var(--pink);
  }
  .stats span{
    background:#fff;
    border-radius:14px;
    padding:4px 14px;
    box-shadow:var(--shadow);
  }

  /* ── Card grid ── */
  #board{
    display:grid;
    gap:8px;
    padding:6px 12px 20px;
    width:100%;
    max-width:520px;
    justify-items:center;
    align-items:center;
  }

  /* ── Individual card ── */
  .card{
    width:100%;
    aspect-ratio:1;
    cursor:pointer;
    perspective:600px;
    border-radius:12px;
  }
  .card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .38s ease;
    border-radius:12px;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner{
    transform:rotateY(180deg);
  }
  .card-face{
    position:absolute;
    inset:0;
    border-radius:12px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  /* Back of card */
  .card-back{
    background:linear-gradient(135deg, var(--pink2) 0%, var(--pink) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(255,105,180,.25);
    border:2px solid rgba(255,255,255,.5);
  }
  .card-back img{
    width:62%;
    opacity:.85;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));
  }
  .card-back .question{
    font-size:2em;
    color:rgba(255,255,255,.7);
  }
  /* Front of card */
  .card-front{
    transform:rotateY(180deg);
    border:3px solid var(--pink2);
    box-shadow:0 4px 12px rgba(255,105,180,.2);
  }
  .card-front img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:9px;
    display:block;
  }
  .card.matched .card-front{
    border-color:var(--pink);
    box-shadow:0 0 0 3px var(--pink), 0 6px 18px rgba(255,105,180,.4);
  }
  .card.matched .card-inner{
    animation:matchPop .35s ease;
  }
  @keyframes matchPop{
    0%  { transform:rotateY(180deg) scale(1); }
    50% { transform:rotateY(180deg) scale(1.08); }
    100%{ transform:rotateY(180deg) scale(1); }
  }
  .card.wrong .card-inner{
    animation:wrongShake .35s ease;
  }
  @keyframes wrongShake{
    0%,100%{ transform:rotateY(180deg) translateX(0); }
    25%     { transform:rotateY(180deg) translateX(-5px); }
    75%     { transform:rotateY(180deg) translateX(5px); }
  }

  /* ── Victory overlay ── */
  #victoryOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(255,240,250,.9);
    z-index:100;
    align-items:center;
    justify-content:center;
    animation:fadeIn .4s ease;
  }
  #victoryOverlay.show{ display:flex; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .victory-box{
    background:#fff;
    border-radius:28px;
    padding:32px 36px;
    box-shadow:0 20px 60px rgba(255,105,180,.25);
    max-width:320px;
    width:90%;
    text-align:center;
  }
  .victory-box .emoji{ font-size:2.8em; }
  .victory-box h2{ font-size:1.8em; color:var(--pink); margin:10px 0 6px; }
  .victory-box .v-stats{
    display:flex;
    gap:12px;
    justify-content:center;
    font-weight:800;
    color:var(--pink);
    font-size:1em;
    margin:10px 0 18px;
  }
  .btn{
    font-family:'Baloo 2',cursive;
    font-size:1em;
    font-weight:800;
    border:none;
    border-radius:32px;
    padding:11px 24px;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .btn:hover{ filter:brightness(.93); }
  .btn:active{ transform:scale(.96); }
  .btn-pink{ background:var(--pink); color:#fff; margin:4px; }
  .btn-white{ background:#fff; color:var(--pink); border:2px solid var(--pink); margin:4px; }

  /* confetti */
  .conf{
    position:fixed;
    width:9px; height:9px;
    border-radius:2px;
    pointer-events:none;
    z-index:150;
    animation:confFall 1.2s ease-in forwards;
  }
  @keyframes confFall{
    0%  { opacity:1; transform:translateY(0) rotate(0deg); }
    100%{ opacity:0; transform:translateY(100px) rotate(720deg); }
  }

  footer{
    padding:20px 16px;
    font-size:.85em;
    opacity:.65;
    text-align:center;
  }
  footer a{ color:var(--pink); text-decoration:none; }
</style>
</head>
<body>

<header>
  <a class="back" href="/kids-games/">← Kids Games</a>
  <h1>🃏 Coco Memory</h1>
</header>

<!-- Difficulty -->
<div class="diff-row">
  <button class="diff-btn active" data-pairs="6"  onclick="setDiff(this)">😊 Easy (6 pairs)</button>
  <button class="diff-btn"        data-pairs="10" onclick="setDiff(this)">🙂 Medium (10 pairs)</button>
  <button class="diff-btn"        data-pairs="15" onclick="setDiff(this)">😎 Hard (15 pairs)</button>
</div>

<!-- Stats -->
<div class="stats">
  <span id="statMoves">Moves: 0</span>
  <span id="statTime">Time: 0:00</span>
  <span id="statPairs">Pairs: 0 / 6</span>
</div>

<!-- Card grid -->
<div id="board"></div>

<!-- Victory -->
<div id="victoryOverlay">
  <div class="victory-box">
    <div class="emoji">🎉</div>
    <h2>You did it!</h2>
    <p id="vMsg">Amazing memory!</p>
    <div class="v-stats">
      <span id="vMoves"></span>
      <span id="vTime"></span>
    </div>
    <button class="btn btn-pink"  id="btnPlayAgain">🔄 Play again</button>
    <button class="btn btn-white" id="btnNewGame">🃏 New cards</button>
  </div>
</div>

<footer><a href="/">Coco the Axolotl</a> · <a href="/kids-games/">Kids Games</a></footer>

<script>
// ── Image pool (same as puzzle game) ──────────────────
const ALL_IMAGES = [
  'axolotl-baby-colored.jpg','axolotl-bear-colored.jpg',
  'axolotl-butterfly-colored.jpg','axolotl-chick-colored.jpg',
  'axolotl-dinosaur-colored.jpg','axolotl-dolphin-colored.jpg',
  'axolotl-dragon-colored.jpg','axolotl-duck-colored.jpg',
  'axolotl-elephant-colored.jpg','axolotl-flamingo-colored.jpg',
  'axolotl-foal-colored.jpg','axolotl-fox-colored.jpg',
  'axolotl-frog-colored.jpg','axolotl-giraffe-colored.jpg',
  'axolotl-goodbye-colored.jpg','axolotl-hedgehog-colored.jpg',
  'axolotl-highland-colored.jpg','axolotl-kitten-colored.jpg',
  'axolotl-koala-colored.jpg','axolotl-lama-colored.jpg',
  'axolotl-lamb-colored.jpg','axolotl-lion-colored.jpg',
  'axolotl-otter-colored.jpg','axolotl-owl-colored.jpg',
  'axolotl-panda-colored.jpg','axolotl-penguin-colored.jpg',
  'axolotl-rabbit-colored.jpg','axolotl-sloth-colored.jpg',
  'axolotl-turtle-colored.jpg','axolotl-unicorn-colored.jpg',
  'axolotl_puffy-colored.jpg','cchristmas ocean axolotl.jpg',
  'coco the axolotl and dolphin.jpg','axolotl redbubble hug me.jpg',
  '1ere couv EN axolotl V5.jpg','BONNE NUIT, COCO.jpg',
  'COCO BORDÉ + RÉGÉNÉRATION.jpg','COCO NE DORT PAS + PAUPIÈRES.jpg',
  'COUVERTURE.jpg','MAMAN AXOLOTL.jpg',
  'coco découvre la coquille.jpg','flamant-rose.jpg',
  'koala.jpg','le-chat.jpg','le-cheval.jpg',
  'le-hibou.jpg','le_dauphin.jpg','paresseux.jpg',
];
function imgPath(n){ return '/puzzle/images/' + encodeURIComponent(n); }

// ── State ──────────────────────────────────────────────
let numPairs    = 6;
let cards       = [];       // DOM elements
let flipped     = [];       // currently face-up (max 2)
let matched     = 0;
let moves       = 0;
let locked      = false;
let timerInt    = null;
let elapsed     = 0;
let selectedImgs= [];

const board      = document.getElementById('board');
const statMoves  = document.getElementById('statMoves');
const statTime   = document.getElementById('statTime');
const statPairs  = document.getElementById('statPairs');
const victoryOv  = document.getElementById('victoryOverlay');
const vMoves     = document.getElementById('vMoves');
const vTime      = document.getElementById('vTime');
const vMsg       = document.getElementById('vMsg');

// ── Timer ──────────────────────────────────────────────
function startTimer(){
  stopTimer();
  elapsed = 0;
  timerInt = setInterval(()=>{
    elapsed++;
    const m = Math.floor(elapsed/60), s = elapsed%60;
    statTime.textContent = 'Time: ' + m + ':' + String(s).padStart(2,'0');
  }, 1000);
}
function stopTimer(){ clearInterval(timerInt); timerInt = null; }
function fmtTime(e){ return Math.floor(e/60)+':'+String(e%60).padStart(2,'0'); }

// ── Shuffle ────────────────────────────────────────────
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ── Sound ──────────────────────────────────────────────
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}
function playSound(type){
  try {
    ensureAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(type==='flip'){
      o.type='sine';
      o.frequency.setValueAtTime(600,audioCtx.currentTime);
      o.frequency.linearRampToValueAtTime(900,audioCtx.currentTime+.08);
      g.gain.setValueAtTime(.12,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);
      o.start(); o.stop(audioCtx.currentTime+.12);
    } else if(type==='match'){
      o.type='sine';
      o.frequency.setValueAtTime(700,audioCtx.currentTime);
      o.frequency.setValueAtTime(900,audioCtx.currentTime+.1);
      o.frequency.setValueAtTime(1100,audioCtx.currentTime+.18);
      g.gain.setValueAtTime(.18,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.35);
      o.start(); o.stop(audioCtx.currentTime+.35);
    } else if(type==='wrong'){
      o.type='sawtooth';
      o.frequency.setValueAtTime(300,audioCtx.currentTime);
      o.frequency.linearRampToValueAtTime(200,audioCtx.currentTime+.18);
      g.gain.setValueAtTime(.08,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.22);
      o.start(); o.stop(audioCtx.currentTime+.22);
    } else if(type==='win'){
      [523,659,784,1047].forEach((f,i)=>{
        const ow=audioCtx.createOscillator(),gw=audioCtx.createGain();
        ow.connect(gw); gw.connect(audioCtx.destination);
        ow.type='sine'; ow.frequency.value=f;
        gw.gain.setValueAtTime(0,audioCtx.currentTime+i*.12);
        gw.gain.linearRampToValueAtTime(.2,audioCtx.currentTime+i*.12+.05);
        gw.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+i*.12+.35);
        ow.start(audioCtx.currentTime+i*.12);
        ow.stop(audioCtx.currentTime+i*.12+.35);
      });
    }
  } catch(e){}
}

// ── Confetti ───────────────────────────────────────────
function confetti(){
  const cols=['#ff69b4','#f7c1cc','#87ceeb','#dda0dd','#ffd700','#98fb98'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div');
    el.className='conf';
    el.style.cssText=`left:${Math.random()*100}vw;top:${20+Math.random()*40}vh;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      animation-delay:${Math.random()*.5}s;
      transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

// ── Build board ────────────────────────────────────────
function buildBoard(){
  board.innerHTML='';
  flipped=[]; matched=0; moves=0; locked=false;
  statMoves.textContent='Moves: 0';
  statTime.textContent='Time: 0:00';
  statPairs.textContent=`Pairs: 0 / ${numPairs}`;
  victoryOv.classList.remove('show');

  // Pick random images
  const pool = shuffle([...ALL_IMAGES]).slice(0, numPairs);
  selectedImgs = pool;
  const deck = shuffle([...pool, ...pool]);

  // Grid columns: adapt to number of pairs
  let cols;
  if(numPairs <= 6)       cols = 4;   // 12 cards → 4×3
  else if(numPairs <= 10) cols = 5;   // 20 cards → 5×4
  else                    cols = 6;   // 30 cards → 6×5

  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  // Card size: fit in viewport
  const boardW = Math.min(window.innerWidth - 24, 520);
  const cardW  = (boardW - (cols-1)*8 - 12) / cols;
  board.style.maxWidth = boardW + 'px';

  cards = deck.map((imgName, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = cardW + 'px';
    card.dataset.img = imgName;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    // Back
    const back = document.createElement('div');
    back.className = 'card-face card-back';
    const backImg = document.createElement('img');
    backImg.src = '/coco.png';
    backImg.alt = '?';
    backImg.onerror = function(){ this.style.display='none'; back.innerHTML='<span class="question">🐠</span>'; };
    back.appendChild(backImg);

    // Front
    const front = document.createElement('div');
    front.className = 'card-face card-front';
    const frontImg = document.createElement('img');
    frontImg.src = imgPath(imgName);
    frontImg.alt = imgName.replace(/-colored\.jpg$/,'').replace(/-/g,' ');
    front.appendChild(frontImg);

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);

    card.addEventListener('click', ()=>onCardClick(card));
    board.appendChild(card);
    return card;
  });

  startTimer();
}

// ── Card click ─────────────────────────────────────────
function onCardClick(card){
  if(locked) return;
  if(card.classList.contains('flipped')) return;
  if(card.classList.contains('matched')) return;
  if(flipped.length >= 2) return;

  playSound('flip');
  card.classList.add('flipped');
  flipped.push(card);

  if(flipped.length === 2) checkMatch();
}

function checkMatch(){
  locked = true;
  moves++;
  statMoves.textContent = 'Moves: ' + moves;

  const [a, b] = flipped;
  if(a.dataset.img === b.dataset.img){
    // Match!
    playSound('match');
    a.classList.add('matched');
    b.classList.add('matched');
    matched++;
    statPairs.textContent = `Pairs: ${matched} / ${numPairs}`;
    flipped = [];
    locked  = false;
    if(matched === numPairs) setTimeout(showVictory, 500);
  } else {
    // No match — shake and flip back
    a.classList.add('wrong');
    b.classList.add('wrong');
    playSound('wrong');
    setTimeout(()=>{
      a.classList.remove('flipped','wrong');
      b.classList.remove('flipped','wrong');
      flipped = [];
      locked  = false;
    }, 900);
  }
}

// ── Victory ────────────────────────────────────────────
function showVictory(){
  stopTimer();
  playSound('win');
  confetti();
  vMoves.textContent = moves + ' moves';
  vTime.textContent  = fmtTime(elapsed);
  const star = moves <= numPairs*2 ? '🌟 Perfect!' :
               moves <= numPairs*3 ? '😊 Well done!' : '💪 Keep it up!';
  vMsg.textContent = star;
  victoryOv.classList.add('show');
}

// ── Controls ───────────────────────────────────────────
function setDiff(btn){
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  numPairs = parseInt(btn.dataset.pairs);
  stopTimer();
  buildBoard();
}

document.getElementById('btnPlayAgain').addEventListener('click', ()=>{
  victoryOv.classList.remove('show');
  // Replay same images, reshuffled
  const deck = shuffle([...selectedImgs, ...selectedImgs]);
  flipped=[]; matched=0; moves=0; locked=false;
  statMoves.textContent='Moves: 0';
  statTime.textContent='Time: 0:00';
  statPairs.textContent=`Pairs: 0 / ${numPairs}`;
  cards.forEach((card, i)=>{
    card.dataset.img = deck[i];
    card.querySelector('.card-front img').src = imgPath(deck[i]);
    card.classList.remove('flipped','matched','wrong');
  });
  startTimer();
});

document.getElementById('btnNewGame').addEventListener('click', ()=>{
  victoryOv.classList.remove('show');
  buildBoard();
});

// Unlock audio on first tap
document.addEventListener('click', ensureAudio, {once:true});

// Start!
buildBoard();
</script>
<script src="/js/lang-switcher.js"></script>
</body>
