<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <title>Je t'aime encore plus &mdash; Lecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:'Baloo 2',cursive;
      background:#1a0533;
      color:#fff;
      min-height:100vh;
      overflow:hidden;
    }

    #reader{ width:100vw; height:100vh; position:relative; z-index:2; }

    .toolbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 16px; background:rgba(0,0,0,.4);
      position:absolute; top:0; left:0; right:0; z-index:20;
      transition:opacity .4s;
    }
    .toolbar.hidden{ opacity:0; pointer-events:none; }
    .toolbar .title{ font-size:.95em; font-weight:600; opacity:.8; }
    .toolbar .page-info{ font-size:.85em; opacity:.6; }
    .toolbar button, .toolbar a.back{
      background:rgba(255,255,255,.1); border:none; color:#fff;
      padding:8px 14px; border-radius:8px; cursor:pointer;
      font-family:'Baloo 2',cursive; font-size:.85em;
      text-decoration:none;
      transition:background .15s;
    }
    .toolbar button:hover, .toolbar a.back:hover{ background:rgba(255,255,255,.2); }

    #book-area{ position:absolute; overflow:hidden; }
    #flipbook-container{ width:100%; height:100%; overflow:hidden; background:transparent; }

    .page{
      background:#fff; color:#333;
      display:flex; align-items:center; justify-content:center;
      user-select:none; overflow:hidden;
    }
    .page.illust{ background:#1a0533; padding:0; }
    .page.illust img{ width:100%; height:100%; object-fit:cover; display:block; }

    #scene-bg{ position:fixed; inset:0; z-index:0; background:
      radial-gradient(ellipse at 20% 20%, #3a1260 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #5a1a8a 0%, transparent 55%),
      #0d0120;
    }
    #scene-overlay{
      position:absolute; inset:0; z-index:2;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.5) 100%);
      pointer-events:none;
    }

    .stf__block, .stf__item{ background:transparent !important; }

    .nav-arrow{
      position:absolute; top:50%; transform:translateY(-50%);
      z-index:10; background:rgba(0,0,0,.3); border:none;
      color:#fff; font-size:1.8em; padding:12px 16px;
      border-radius:50%; cursor:pointer;
      transition:background .15s, opacity .15s;
      opacity:.6;
    }
    .nav-arrow:hover{ background:rgba(0,0,0,.5); opacity:1; }
    .nav-arrow.left{ left:12px; }
    .nav-arrow.right{ right:12px; }

    .audio-bar{
      display:flex; align-items:center; gap:10px;
      padding:8px 16px; background:rgba(0,0,0,.5);
      position:absolute; bottom:0; left:0; right:0; z-index:20;
    }
    .audio-btn{
      background:rgba(255,255,255,.12); border:none; color:#fff;
      width:38px; height:38px; border-radius:50%; cursor:pointer;
      font-size:1.1em; display:flex; align-items:center; justify-content:center;
      transition:background .15s; flex-shrink:0;
    }
    .audio-btn:hover{ background:rgba(255,255,255,.25); }
    .audio-btn.active{ background:rgba(192,132,252,.3); color:#c084fc; }
    .auto-indicator{
      font-size:.65em; font-weight:800; color:#c084fc;
      opacity:0; transition:opacity .2s; margin-left:-6px;
    }
    .auto-indicator.visible{ opacity:1; }
    .time-label{ font-size:.75em; opacity:.6; flex-shrink:0; min-width:32px; }
    .progress-wrap{
      flex:1; min-width:80px; height:6px;
      background:rgba(255,255,255,.15); border-radius:3px;
      cursor:pointer; position:relative;
    }
    .progress-fill{
      height:100%; background:#c084fc; border-radius:3px;
      width:0; transition:width .1s linear;
    }

    .credit{
      text-align:center; padding:6px; font-size:.7em; opacity:.4;
      position:absolute; bottom:54px; left:0; right:0; z-index:20;
    }

    @media(max-width:600px){
      .nav-arrow{ display:none; }
      .toolbar .title{ font-size:.8em; }
      .audio-bar{ gap:6px; padding:6px 10px; }
      .audio-btn{ width:32px; height:32px; font-size:.95em; }
      .time-label{ font-size:.65em; }
      .credit{ font-size:.6em; bottom:46px; }
    }
  </style>
</head>

<body>
  <div id="scene-bg"><div id="scene-overlay"></div></div>

  <div id="reader">
    <div class="toolbar">
      <a class="back" href="/je-taime-encore-plus/">&larr; Retour</a>
      <span class="title">Je t'aime encore plus !</span>
      <span class="page-info" id="pageInfo">1 / 29</span>
      <button onclick="toggleFullscreen()">&#x26F6; Plein &eacute;cran</button>
    </div>

    <div id="book-area"><div id="flipbook-container"></div></div>

    <button class="nav-arrow left" onclick="flipPrev()">&lsaquo;</button>
    <button class="nav-arrow right" onclick="flipNext()">&rsaquo;</button>

    <div class="audio-bar">
      <button class="audio-btn" id="playBtn" title="Lecture / Pause">&#9654;&#65039;</button>
      <button class="audio-btn active" id="autoBtn" title="Tourner les pages automatiquement">&#128214;</button>
      <span class="auto-indicator visible" id="autoLabel">AUTO</span>
      <span class="time-label" id="timeNow">0:00</span>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time-label" id="timeTotal">0:00</span>
    </div>
    <audio id="narrator" preload="auto"></audio>
    <audio id="bgMusic" src="/sleep-book/audio/lullaby.mp3" preload="auto" loop></audio>
    <audio id="pageTurnSfx" src="/je-taime-encore-plus/audio/page-turn.mp3" preload="auto"></audio>
    <div class="credit">Par Dr. Anita Nirvena &mdash; Illustrations par Loopinky</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <script>
    var pageFlip = null;
    var IMG = '/je-taime-encore-plus/pages/';
    var AUD = '/je-taime-encore-plus/audio/';
    var TOTAL_PAGES = 29;
    var PAGE_ASPECT = 8.5 / 11; // portrait

    // Durations (seconds) from generate_fr_audio.py output
    var durations = [5.96, 4.69, 0.50, 5.03, 0.50, 10.91, 8.69, 5.92, 6.98, 6.15, 6.54, 8.48, 6.03, 9.88, 5.56, 7.12, 3.44, 13.56, 8.72, 4.14, 5.46, 4.76, 5.53, 5.00, 11.57, 3.32, 4.31, 1.90, 2.70];

    var bookPages = [];
    for(var i = 1; i <= TOTAL_PAGES; i++){
      bookPages.push(IMG + 'slide_' + String(i).padStart(2,'0') + '.jpg');
    }

    function positionFlipbook(){
      var area = document.getElementById('book-area');
      if(!area) return;
      var vpW = window.innerWidth;
      var vpH = window.innerHeight;
      var availH = vpH - 44 - 52;
      var availW = vpW - 32;
      var bookAspect = 2 * PAGE_ASPECT;
      var h = Math.min(availH, availW / bookAspect);
      var w = h * bookAspect;
      if(w > availW){ w = availW; h = w / bookAspect; }
      area.style.width  = w + 'px';
      area.style.height = h + 'px';
      area.style.left   = Math.round((vpW - w) / 2) + 'px';
      area.style.top    = Math.round(44 + (availH - h) / 2) + 'px';
    }

    window.addEventListener('resize', function(){
      positionFlipbook();
      if(pageFlip) pageFlip.update();
    });

    function initFlipbook(){
      var container = document.getElementById('flipbook-container');
      positionFlipbook();
      var area = document.getElementById('book-area');
      var w = Math.round(area.offsetWidth / 2);
      var h = Math.round(area.offsetHeight);

      bookPages.forEach(function(src){
        var div = document.createElement('div');
        div.className = 'page illust';
        div.innerHTML = '<img src="' + src + '" alt="" loading="lazy">';
        container.appendChild(div);
      });

      try{
        pageFlip = new St.PageFlip(container, {
          width: w, height: h,
          size: 'stretch',
          minWidth: 150, maxWidth: w,
          minHeight: 200, maxHeight: h,
          showCover: true,
          mobileScrollSupport: false,
          useMouseEvents: true,
          flippingTime: 700,
          usePortrait: true,
          startZIndex: 0
        });
        pageFlip.loadFromHTML(container.querySelectorAll('.page'));
        pageFlip.on('flip', function(e){ onPageFlip(e.data); });
        pageFlip.on('changeState', function(e){
          if(e.data === 'flipping' || e.data === 'user_fold') playPageTurn();
        });
      } catch(e){ console.error('PageFlip init error:', e); }
    }

    function flipPrev(){ if(pageFlip) pageFlip.flipPrev(); }
    function flipNext(){ if(pageFlip) pageFlip.flipNext(); }

    var toolbar = document.querySelector('.toolbar');
    var hideTimer = null;
    function showToolbar(){
      toolbar.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){ toolbar.classList.add('hidden'); }, 2500);
    }
    document.addEventListener('mousemove', showToolbar);
    document.addEventListener('touchstart', showToolbar);
    showToolbar();

    function toggleFullscreen(){
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(function(){});
      } else {
        document.exitFullscreen();
      }
    }

    // ===== AUDIO =====
    var audio = document.getElementById('narrator');
    var bgMusic = document.getElementById('bgMusic');
    var pageTurnSfx = document.getElementById('pageTurnSfx');
    pageTurnSfx.volume = 0.35;
    function playPageTurn(){
      try { pageTurnSfx.currentTime = 0; pageTurnSfx.play().catch(function(){}); } catch(e){}
    }
    var BG_VOLUME = 0.15;
    bgMusic.volume = BG_VOLUME;
    var playBtn = document.getElementById('playBtn');
    var autoBtn = document.getElementById('autoBtn');
    var autoLabel = document.getElementById('autoLabel');
    var progressWrap = document.getElementById('progressWrap');
    var progressFill = document.getElementById('progressFill');
    var timeNow = document.getElementById('timeNow');
    var timeTotal = document.getElementById('timeTotal');

    var totalDuration = 0;
    var cumulativeStarts = [];
    (function(){
      var cum = 0;
      for(var i = 0; i < durations.length; i++){
        cumulativeStarts.push(cum);
        cum += durations[i];
      }
      totalDuration = cum;
      timeTotal.textContent = fmtTime(totalDuration);
    })();

    var currentPage = -1;
    var isPlaying = false;
    var autoTurn = true;
    var bgFadeTimer = null;

    function fmtTime(s){
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2,'0');
    }

    function pageAudioSrc(p){
      return AUD + 'page_' + String(p).padStart(2,'0') + '.mp3';
    }

    function fadeOutBgMusic(){
      clearInterval(bgFadeTimer);
      bgFadeTimer = setInterval(function(){
        if(bgMusic.volume > 0.01){
          bgMusic.volume = Math.max(0, bgMusic.volume - 0.005);
        } else {
          clearInterval(bgFadeTimer);
          bgMusic.pause();
          bgMusic.volume = BG_VOLUME;
        }
      }, 100);
    }

    function startBgMusic(){
      clearInterval(bgFadeTimer);
      bgMusic.volume = BG_VOLUME;
      bgMusic.play().catch(function(){});
    }

    function loadPageAudio(p){
      if(p < 0 || p >= TOTAL_PAGES) return;
      currentPage = p;
      audio.src = pageAudioSrc(p);
      audio.load();
    }

    function playPage(p){
      if(p < 0 || p >= TOTAL_PAGES) return;
      loadPageAudio(p);
      audio.play().catch(function(){});
      startBgMusic();
      isPlaying = true;
      playBtn.innerHTML = '&#9646;&#9646;';
    }

    function togglePlay(){
      if(audio.paused){
        if(currentPage < 0){
          var pg = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
          loadPageAudio(pg);
        }
        audio.play().catch(function(){});
        startBgMusic();
        isPlaying = true;
        playBtn.innerHTML = '&#9646;&#9646;';
      } else {
        audio.pause();
        bgMusic.pause();
        isPlaying = false;
        playBtn.innerHTML = '&#9654;&#65039;';
      }
    }

    function toggleAuto(){
      autoTurn = !autoTurn;
      autoBtn.classList.toggle('active', autoTurn);
      autoLabel.classList.toggle('visible', autoTurn);
    }

    function globalTime(){
      if(currentPage < 0) return 0;
      return cumulativeStarts[currentPage] + (audio.currentTime || 0);
    }

    playBtn.addEventListener('click', togglePlay);
    autoBtn.addEventListener('click', toggleAuto);

    audio.addEventListener('timeupdate', function(){
      var gt = globalTime();
      progressFill.style.width = (gt / totalDuration * 100) + '%';
      timeNow.textContent = fmtTime(gt);
    });

    audio.addEventListener('ended', function(){
      if(autoTurn && currentPage >= 0 && currentPage < TOTAL_PAGES - 1){
        var next = currentPage + 1;
        if(pageFlip) pageFlip.flip(next);
        setTimeout(function(){
          if(currentPage !== next) playPage(next);
        }, 900);
      } else {
        isPlaying = false;
        fadeOutBgMusic();
        playBtn.innerHTML = '&#9654;&#65039;';
      }
    });

    progressWrap.addEventListener('click', function(e){
      var rect = progressWrap.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      var targetTime = pct * totalDuration;
      var targetPage = 0;
      for(var i = TOTAL_PAGES - 1; i >= 0; i--){
        if(targetTime >= cumulativeStarts[i]){ targetPage = i; break; }
      }
      var offset = targetTime - cumulativeStarts[targetPage];
      if(targetPage !== currentPage){
        loadPageAudio(targetPage);
        if(pageFlip) pageFlip.flip(targetPage);
      }
      audio.currentTime = offset;
      if(isPlaying) audio.play().catch(function(){});
    });

    function onPageFlip(pgIndex){
      document.getElementById('pageInfo').textContent = (pgIndex + 1) + ' / ' + TOTAL_PAGES;
      if(pgIndex !== currentPage){
        playPage(pgIndex);
      }
    }

    document.addEventListener('keydown', function(e){
      if(e.key === ' '){ e.preventDefault(); togglePlay(); }
      if(e.key === 'ArrowLeft') flipPrev();
      if(e.key === 'ArrowRight') flipNext();
    });

    initFlipbook();
  </script>
</body>
</html>
