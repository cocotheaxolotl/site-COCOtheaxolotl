<h1>ウーパールーパーについて学ぼう</h1>
<p class="intro">ウーパールーパーの体、すみか、再生能力、守るためにできることを子ども向けにやさしく紹介します。</p>
<p>ウーパールーパーはメキシコの湖にすむ特別な両生類です。大人になっても水の中で暮らし、外側にふわふわしたえらを持っています。</p>
<p>自然のすみかは少なくなっているため、きれいな水と安全な環境を守ることが大切です。Cocoのページでは、かわいいだけでなく命を大切にする気持ちも育てます。</p>
